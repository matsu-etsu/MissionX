<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt | Confirmation</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/confirmation.css" />
    <script src="../js/global.js" defer></script>
    <script src="../js/confirmation.js" defer></script>
  </head>
  <body>
    <main>
      <section id="confirmation" class="screen confirmation-page">
        <header class="site-header">
          <div class="topbar">
            <img
              class="council-logo"
              src="../assets/council-logo.png"
              alt="Auckland Council"
            />
            <a class="brand" href="issue-type.html">FixIt</a>
            <button class="menu-button" aria-label="menu" type="button">
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>
          <search>
            <form action="./search/">
              <label for="search-input" class="visually-hidden">Search</label>
              <input
                type="search"
                id="search-input"
                name="q"
                placeholder="Search"
              />
            </form>
          </search>
          <div class="steps">
            <span class="done"></span>
            <span class="done"></span>
            <span class="done"></span>
            <span class="done"></span>
            <span class="done"></span>
          </div>
        </header>
        <div class="screen-content">
          <h1 class="title">Report received!</h1>
          <div class="success-mark">✓</div>
          <div class="reference">Reference number: XWFGBE</div>
          <a class="button outline home-button" href="#issue-type">Home page</a>
        </div>
      </section>
    </main>
  </body>
</html>
