<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt | Details</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/detailes.css" />
    <script src="../js/global.js" defer></script>
    <script src="../js/details.js" defer></script>
  </head>
  <body>
    <main>
      <section id="details" class="screen details-page photo-state">
        <header class="site-header">
          <div class="topbar">
            <img
              class="council-logo"
              src="../assets/council-logo.png"
              alt="Auckland Council"
            />
            <a class="brand" href="issue-type.html">FixIt</a>
            <button class="menu-button" aria-label="menu" type="button">
              <span></span>
              <span></span>
              <span></span>
            </button>
            <nav class="menu-list" id="main-menu" hidden>
              <ul>
                <li><a href="#home">Home</a></li>
                <li>
                  <a href="issue-type.html" class="menu-report">
                    <span>FixIt</span>
                    <span class="small-text-in-menu">-Report an issue</span></a
                  >
                </li>
                <li><a href="history.html">My reports</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#help">Help</a></li>
                <li><a href="#contact">Contact us</a></li>
                <li><a href="login.html">Log in</a></li>
              </ul>
            </nav>
          </div>
        </header>
        <div class="screen-content">
          <form class="screen-form">
            <h1 class="title tell-us">Tell us about it</h1>
            <textarea
              class="details-box"
              placeholder="Enter issue details (e.g. I saw a fallen tree in the middle of the lane)"
            ></textarea>
            <p class="error-message" role="alert" hidden>
              ! Please describe details
            </p>

            <!-- Photo -->
            <div class="photo-area">
              <!-- Photo notice hidden -->
              <div class="photo-status">
                <div class="photo-uploading" hidden>
                  <h1 class="title">Add photos</h1>
                  <div class="photo-card photo-notice">
                    <img
                      class="notification-icon"
                      src="../assets/clock-history.svg"
                      alt=""
                    />
                    <h2 role="alert">Uploading photo...</h2>
                    <div class="upload-progress">
                      <div class="upload-progress-fill"></div>
                    </div>
                  </div>
                </div>

                <div class="photo-uploaded" hidden>
                  <h1 class="title">Add photos</h1>
                  <div class="photo-card">
                    <div class="success-mark">✓</div>
                    <h2 role="alert">Photo uploaded!</h2>
                  </div>
                </div>

                <div class="photo-error" hidden>
                  <h1 class="title">Add photos</h1>
                  <div class="photo-card photo-notice">
                    <img
                      class="notification-icon"
                      src="../assets/photo-error.svg"
                      alt=""
                    />
                    <h2 class="photo-error-title" role="alert">
                      This file cannot be uploaded
                    </h2>
                    <p class="photo-error-message" role="alert">
                      Use JPG, PNG under 3MB.
                    </p>
                    <button
                      class="close-error"
                      type="button"
                      aria-label="Close an error screen"
                    >
                      <span class="close-mark" aria-hidden="true">&times;</span
                      ><span class="close-text" aria-hidden="true">Close</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Photo actions -->
            <div class="photo-actions">
              <label class="photo-action add-photos"
                ><img
                  class="photo-action-icon"
                  src="../assets/plus.svg"
                  alt="" />Add photos<input
                  type="file"
                  accept="image/*"
                  multiple
                  class="visually-hidden"
              /></label>
              <label class="photo-action take-photos"
                ><img
                  class="photo-action-icon"
                  src="../assets/camera.svg"
                  alt="" />Take new photos<input
                  type="file"
                  accept="image/*"
                  capture="environment"
                  class="visually-hidden"
              /></label>
            </div>
            <button class="button continue" type="button">
              Continue <span class="arrow" aria-hidden="true">→</span>
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
