<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt | Contact</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/contact.css" />
  </head>
  <body>
    <main>
      <!-- Task 12.4 -->
      <section id="contact" class="screen contact-page">
        <header class="site-header">
          <div class="topbar">
            <a class="menu" href="#issue-type">
              <span></span>
              <span></span>
              <span></span>
            </a>
            <a class="brand" href="#issue-type">FixIt</a>
            <img
              class="council-logo"
              src="../assets/council-logo.png"
              alt="Auckland Council"
            />
          </div>
          <input class="search" type="search" placeholder="Search" />
          <div class="steps">
            <span class="done"></span>
            <span class="done"></span>
            <span class="done"></span>
            <span class="done"></span>
            <span></span>
          </div>
        </header>
        <div class="screen-content">
          <h1 class="title">How do we contact you?</h1>
          <form class="screen-form contact-form">
            <div class="contact-options">
              <a class="button outline contact-choice selected" href="#contact"
                >Add contact details</a
              >
              <a
                class="button outline contact-choice anonymous"
                href="#confirmation"
                >Report anonymously</a
              >
            </div>
            <div class="field">
              <label class="field-label" for="contact-contact-name"
                >Full name</label
              >
              <input
                class="field-input"
                type="text"
                id="contact-contact-name"
                placeholder="e.g. Linda Smith"
              />
              <p id="name-error" class="error-message" role="alert" hidden></p>
            </div>
            <div class="field">
              <label class="field-label" for="contact-contact-email"
                >Email address</label
              >
              <input
                class="field-input"
                type="email"
                id="contact-contact-email"
                placeholder="lindaS@gmail.com"
              />
              <p id="email-error" class="error-message" role="alert" hidden></p>
            </div>
            <div class="field">
              <label class="field-label" for="contact-contact-phone"
                >Phone number</label
              >
              <input
                class="field-input"
                type="tel"
                id="contact-contact-phone"
                placeholder="+64 0248573752"
              />
              <p id="phone-error" class="error-message" role="alert" hidden></p>
            </div>
            <a class="button continue" href="#confirmation">Continue <span class="arrow" aria-hidden="true">→</span></a>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
