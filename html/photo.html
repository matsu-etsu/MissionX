<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt | Add photos</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/photo.css" />
  </head>
  <body>
    <main>
      <!-- Task 14.1 -->
      <section id="upload-error" class="screen photo-state">
        <header class="site-header">
          <div class="topbar">
            <img
              class="council-logo"
              src="../assets/council-logo.png"
              alt="Auckland Council"
            />
            <a class="brand" href="issue-type.html">FixIt</a>
            <button class="menu-button">
              <span></span>
              <span></span>
              <span></span>
            </button>
            <nav class="menu-list" id="main-menu" hidden>
              <ul>
                <li><a href="#home">Home</a></li>
                <li>
                  <a href="issue-type.html" class="menu-report">
                    <span>FixIt</span>
                    <span class="small-text-in-menu">-Report an issue</span></a
                  >
                </li>
                <li><a href="history.html">My reports</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#help">Help</a></li>
                <li><a href="#contact">Contact us</a></li>
                <li><a href="login.html">Log in</a></li>
              </ul>
            </nav>
          </div>

          <search>
            <form action="./search/">
              <label for="search-input" class="visually-hidden">Search</label>
              <input
                type="search"
                id="search-input"
                name="q"
                placeholder="Search"
              />
            </form>
          </search>
        </header>
        <div class="screen-content">
          <h1 class="title">Add photos</h1>
          <div class="photo-card photo-notice">
            <img
              class="notification-icon"
              src="../assets/photo-error.svg"
              alt=""
            />
            <h2 class="photo-error-title">This file cannot be uploaded</h2>
            <p class="photo-error-message">Use JPG, PNG under 3MB.</p>
          </div>
          <div class="photo-actions">
            <button id="add-photos" class="photo-action" type="button">
              <img
                class="photo-action-icon"
                src="../assets/plus.svg"
                alt=""
              />Add photos<input type="file" accept="image/*" />
            </button>
            <button
              id="take-photos"
              class="photo-action take-photos"
              type="button"
            >
              <img
                class="photo-action-icon"
                src="../assets/camera.svg"
                alt=""
              />Take new photos<input type="file" accept="image/*" />
            </button>
          </div>
          <button class="button continue" type="button">
            Continue <span class="arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
