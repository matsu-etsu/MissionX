<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt | Add photos</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/photo.css" />
  </head>
  <body>
    <main>
  <!-- Task 14.1 -->
      <section id="upload-error" class="screen photo-state">
        <header class="site-header">
          <div class="topbar">
            <a class="menu" href="#issue-type">
              <span></span>
              <span></span>
              <span></span>
            </a>
            <a class="brand" href="#issue-type">FixIt</a>
            <img
              class="council-logo"
              src="../assets/council-logo.png"
              alt="Auckland Council"
            />
          </div>
          <input class="search" type="search" placeholder="Search" />
        </header>
        <div class="screen-content">
          <h1 class="title">Add photos</h1>
          <div class="photo-card photo-notice">
            <img class="notification-icon" src="../assets/photo-error.svg" alt="" />
            <h2 class="photo-error-title">This file cannot be uploaded</h2>
            <p class="photo-error-message">Use JPG, PNG under 3MB.</p>
          </div>
          <div class="photo-actions">
            <label class="photo-action add-photos"
              ><img class="photo-action-icon" src="../assets/plus.svg" alt="" />Add photos<input type="file" accept="image/*"
            /></label>
            <label class="photo-action take-photos"
              ><img class="photo-action-icon" src="../assets/camera.svg" alt="" />Take new photos<input type="file" accept="image/*"
            /></label>
          </div>
          <a class="button continue" href="#location">Continue <span class="arrow" aria-hidden="true">→</span></a>
        </div>
      </section>
    </main>
  </body>
</html>
