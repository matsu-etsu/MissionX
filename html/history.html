<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt | History</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/history.css" />
  </head>
  <body>
    <main>
    <!-- Task 13.3 -->
      <section id="history" class="screen history-page">
        <header class="site-header">
          <div class="topbar">
            <a class="menu" href="#issue-type">
              <span></span>
              <span></span>
              <span></span>
            </a>
            <a class="brand" href="#issue-type">FixIt</a>
            <img
              class="council-logo"
              src="../assets/council-logo.png"
              alt="Auckland Council"
            />
          </div>
          <input class="search" type="search" placeholder="Search" />
        </header>
        <div class="screen-content">
          <h1 class="title">History</h1>
          <div class="counts">
            <span>All 3</span>
            <span>In progress 2</span>
            <span>Resolved 1</span>
          </div>
          <div class="report-list">
            <section class="history-row first">
              <div class="report-details">
                <h2>Graffiti</h2>
                <p>#3EXARSG</p>
                <p>16/08/2026</p>
              </div>
              <span class="badge">In progress</span>
            </section>
            <section class="history-row second">
              <div class="report-details">
                <h2>Overflowing Rubbish Bin</h2>
                <p>#4EXARSG</p>
                <p>16/08/2026</p>
              </div>
              <span class="badge">In progress</span>
            </section>
            <section class="history-row third">
              <div class="report-details">
                <h2>Overflowing Rubbish Bin</h2>
                <p>#6EXARSG</p>
                <p>14/08/2026</p>
              </div>
              <span class="badge resolved">Resolved</span>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
